[package]
name = "rusn_dos"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["env", "derive"] }
env_logger = "0.11.10"
log = { version = "0.4.32", features = ["std"] }
serde = { version = "1.0.228", features = ["derive", "serde_derive"] }
serde_json = "1.0.150"
toml = "1.1.2+spec-1.1.0"
bus = { path = "crate/bus" }
x86 = { path = "crate/x86" }
dos = { path = "crate/dos" }
gui = { path = "crate/gui" }
config = "0.15.23"

[workspace]
members = ['crate/*']
resolver = "2"
